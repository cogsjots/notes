###### ಗಾದೆಗಳು

### ೧. ಕಾಯಕವೇ ಕೈಲಾಸ.

###### Kāyakavē Kailāsa.

</script></section><section data-markdown><script type="text/template">
<!-- .slide: data-auto-animate data-transition="slide" data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

###### ಗಾದೆಗಳು

### ೧. ಕಾಯಕವೇ ಕೈಲಾಸ.

###### Work itself is Kailasa; work is worship.

<aside class="notes"><h5 id="👉-diligent-work-is-divine-and-brings-fulfillment">👉 Diligent work is divine and brings fulfillment.</h5>
<ul>
<li><strong>ಕಾಯಕವೇ</strong> (Kāyakavē) – Work itself</li>
<li><strong>ಕೈಲಾಸ</strong> (Kailāsa) – Kailasa (abode of Shiva; symbol of bliss/heaven)</li>
</ul>
<h6 id="kāyakavē-kailāsa">Kāyakavē Kailāsa.</h6>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗಾದೆಗಳು

### ೨. ಅತಿ ಆಸೆ ಗೆತಿ ಕೇಡು.

###### Ati āse geti kēḍu.

</script></section><section data-markdown><script type="text/template">
<!-- .slide: data-auto-animate data-transition="slide" data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

###### ಗಾದೆಗಳು

### ೨. ಅತಿ ಆಸೆ ಗೆತಿ ಕೇಡು.

###### Excessive greed (desire) leads to ruin.

<aside class="notes"><h5 id="👉-this-proverb-teaches-that-too-much-greed-or-desire-eventually-causes-harm">👉 This proverb teaches that too much greed or desire eventually causes harm.</h5>
<ul>
<li><strong>ಅತಿ</strong> (Ati) – Excess / Too much</li>
<li><strong>ಆಸೆ</strong> (Āse) – Desire / Greed</li>
<li><strong>ಗೆತಿ</strong> (Geti) – Consequence / Result / Cause</li>
<li><strong>ಕೇಡು</strong> (Kēḍu) – Harm / Ruin / Evil</li>
</ul>
<h6 id="ati-āse-geti-kēḍu">Ati āse geti kēḍu.</h6>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗಾದೆಗಳು

### ೩. ಮಾತು ಬೆಳ್ಳಿ, ಮೌನ ಬಂಗಾರ.

###### Mātu beḷḷi, mauna baṅgāra.

</script></section><section data-markdown><script type="text/template">
<!-- .slide: data-auto-animate data-transition="slide" data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

###### ಗಾದೆಗಳು

### ೩. ಮಾತು ಬೆಳ್ಳಿ, ಮೌನ ಬಂಗಾರ.

###### Speech is silver, silence is gold.

<aside class="notes"><h5 id="👉-speaking-wisely-is-good-the-right-silence-is-even-more-valuable">👉 Speaking wisely is good; the right silence is even more valuable.</h5>
<ul>
<li><strong>ಮಾತು</strong> (Mātu) – Word / Speech</li>
<li><strong>ಬೆಳ್ಳಿ</strong> (Beḷḷi) – Silver</li>
<li><strong>ಮೌನ</strong> (Mauna) – Silence</li>
<li><strong>ಬಂಗಾರ</strong> (Baṅgāra) – Gold</li>
</ul>
<h6 id="mātu-beḷḷi-mauna-baṅgāra">Mātu beḷḷi, mauna baṅgāra.</h6>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗಾದೆಗಳು

### ೪. ವೇದ ಸುಳ್ಳಾದರು, ಗಾದೆ ಸುಳ್ಳಾಗದು.

###### Vēda suḷḷādaru, gāde suḷḷāgadu.

</script></section><section data-markdown><script type="text/template">
<!-- .slide: data-auto-animate data-transition="slide" data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

###### ಗಾದೆಗಳು

### ೪. ವೇದ ಸುಳ್ಳಾದರು, ಗಾದೆ ಸುಳ್ಳಾಗದು.

###### Even if scriptures were false, proverbs aren’t.

<aside class="notes"><h5 id="👉-folk-wisdom-distilled-from-lived-experience-holds-enduring-truth">👉 Folk wisdom, distilled from lived experience, holds enduring truth.</h5>
<ul>
<li><strong>ವೇದ</strong> (Vēda) – Veda / Scripture</li>
<li><strong>ಸುಳ್ಳಾದರು</strong> (Suḷḷādaru) – Even if false</li>
<li><strong>ಗಾದೆ</strong> (Gāde) – Proverb / Saying</li>
<li><strong>ಸುಳ್ಳಾಗದು</strong> (Suḷḷāgadu) – Is not false</li>
</ul>
<h6 id="vēda-suḷḷādaru-gāde-suḷḷāgadu">Vēda suḷḷādaru, gāde suḷḷāgadu.</h6>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗಾದೆಗಳು

### ೫. ಮಾಡಿದುಣೊ ಮಹರಾಯ.

###### Māḍiduṇo Maharāya.

</script></section><section data-markdown><script type="text/template">
<!-- .slide: data-auto-animate data-transition="slide" data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

###### ಗಾದೆಗಳು

### ೫. ಮಾಡಿದುಣೊ ಮಹರಾಯ.

###### Work first, then eat, O King.

<aside class="notes"><h5 id="👉-one-must-earn-comforts-through-work-before-enjoying-them">👉 One must earn comforts through work before enjoying them.</h5>
<ul>
<li><strong>ಮಾಡಿ</strong> (Māḍi) – Do / Work</li>
<li><strong>ದುಣೊ</strong> (Duṇo) – Eat (old usage)</li>
<li><strong>ಮಹರಾಯ</strong> (Maharāya) – King / Great man</li>
</ul>
<h6 id="māḍiduṇo-maharāya">Māḍiduṇo Maharāya.</h6>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗಾದೆಗಳು

### ೬. ಮೂರ್ತಿ ಚಿಕ್ಕದಾದರೂ, ಕೀರ್ತಿ ದೊಡ್ಡದು.

###### Mūrti cikkadādaru, kīrti doḍḍadu.

</script></section><section data-markdown><script type="text/template">
<!-- .slide: data-auto-animate data-transition="slide" data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

###### ಗಾದೆಗಳು

### ೬. ಮೂರ್ತಿ ಚಿಕ್ಕದಾದರೂ, ಕೀರ್ತಿ ದೊಡ್ಡದು.

###### The figure may be small; the fame is great.

<aside class="notes"><h5 id="👉-true-greatness-comes-from-deeds-not-size-or-appearance">👉 True greatness comes from deeds, not size or appearance.</h5>
<ul>
<li><strong>ಮೂರ್ತಿ</strong> (Mūrti) – Person / Figure</li>
<li><strong>ಚಿಕ್ಕದಾದರೂ</strong> (Cikkadādaru) – Even if small</li>
<li><strong>ಕೀರ್ತಿ</strong> (Kīrti) – Fame / Reputation</li>
<li><strong>ದೊಡ್ಡದು</strong> (Doḍḍadu) – Big / Great</li>
</ul>
<h6 id="mūrti-cikkadādaru-kīrti-doḍḍadu">Mūrti cikkadādaru, kīrti doḍḍadu.</h6>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗಾದೆಗಳು

### ೭. ಕೈ ಕೆಸರಾದರೆ ಬಾಯಿ ಮೊಸರು.

###### Kai kesaradare bāyi mosaru.

</script></section><section data-markdown><script type="text/template">
<!-- .slide: data-auto-animate data-transition="slide" data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

###### ಗಾದೆಗಳು

### ೭. ಕೈ ಕೆಸರಾದರೆ ಬಾಯಿ ಮೊಸರು.

###### If hands get dirty, the mouth gets curds.

<aside class="notes"><h5 id="👉-hard-work-brings-reward-without-effort-there-is-no-comfort">👉 Hard work brings reward; without effort there is no comfort.</h5>
<ul>
<li><strong>ಕೈ</strong> (Kai) – Hand</li>
<li><strong>ಕೆಸರಾದರೆ</strong> (Kesarādare) – If (they) get dirty (by work)</li>
<li><strong>ಬಾಯಿ</strong> (Bāyi) – Mouth</li>
<li><strong>ಮೊಸರು</strong> (Mosaru) – Curd / Yogurt</li>
</ul>
<h6 id="kai-kesaradare-bāyi-mosaru">Kai kesaradare bāyi mosaru.</h6>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗಾದೆಗಳು

### ೮. ಶಕ್ತಿಗಿಂತ ಯುಕ್ತಿಮೇಲು.

###### Shaktigiṁta yuktimēlu.

</script></section><section data-markdown><script type="text/template">
<!-- .slide: data-auto-animate data-transition="slide" data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

###### ಗಾದೆಗಳು

### ೮. ಶಕ್ತಿಗಿಂತ ಯುಕ್ತಿಮೇಲು.

###### Strategy is superior to strength.

<aside class="notes"><h5 id="👉-brains-beat-brawn-clever-strategy-outdoes-brute-force">👉 Brains beat brawn; clever strategy outdoes brute force.</h5>
<ul>
<li><strong>ಶಕ್ತಿ</strong> (Shakti) – Strength / Power</li>
<li><strong>ಗಿಂತ</strong> (Giṁta) – Than</li>
<li><strong>ಯುಕ್ತಿ</strong> (Yukti) – Intelligence / Tact / Strategy</li>
<li><strong>ಮೇಲು</strong> (Mēlu) – Better / Superior</li>
</ul>
<h6 id="shaktigiṁta-yuktimēlu">Shaktigiṁta yuktimēlu.</h6>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗಾದೆಗಳು

### ೯. ತಾಯಿಗಿಂತ ಬಂಧುವಿಲ್ಲ ಉಪ್ಪಿಗಿಂತ ರುಚಿಯಿಲ್ಲ.

###### Tāyigiṁta bandhu illa, uppigiṁta ruciyilla.

</script></section><section data-markdown><script type="text/template">
<!-- .slide: data-auto-animate data-transition="slide" data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

###### ಗಾದೆಗಳು

### ೯. ತಾಯಿಗಿಂತ ಬಂಧುವಿಲ್ಲ ಉಪ್ಪಿಗಿಂತ ರುಚಿಯಿಲ್ಲ.

###### There is no relative like mother, no taste like salt.

<aside class="notes"><h5 id="👉-mother-is-the-highest-relation-and-salt-the-most-essential-taste">👉 Mother is the highest relation, and salt the most essential taste.</h5>
<ul>
<li><strong>ತಾಯಿ</strong> (Tāyi) – Mother</li>
<li><strong>ಗಿಂತ</strong> (Giṁta) – Than</li>
<li><strong>ಬಂಧು</strong> (Bandhu) – Relative</li>
<li><strong>ಇಲ್ಲ</strong> (Illa) – None / Not there</li>
<li><strong>ಉಪ್ಪು</strong> (Uppu) – Salt</li>
<li><strong>ರುಚಿ</strong> (Ruci) – Taste</li>
</ul>
<h6 id="tāyigiṁta-bandhu-illa-uppigiṁta-ruciyilla">Tāyigiṁta bandhu illa, uppigiṁta ruciyilla.</h6>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗಾದೆಗಳು

### ೧೦. ಗಿಡವಾಗಿ ಬಗ್ಗದ್ದು ಮರವಾಗಿ ಬಗೀತೆ?

###### Giḍavāgi baggadu, maravāgi bagīte?

</script></section><section data-markdown><script type="text/template">
<!-- .slide: data-auto-animate data-transition="slide" data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

###### ಗಾದೆಗಳು

### ೧೦. ಗಿಡವಾಗಿ ಬಗ್ಗದ್ದು ಮರವಾಗಿ ಬಗೀತೆ?

###### If it won’t bend as a sapling, will it bend as a tree?

<aside class="notes"><h5 id="👉-early-discipline-is-crucial-what-isnt-corrected-in-youth-is-hard-to-correct-later">👉 Early discipline is crucial; what isn’t corrected in youth is hard to correct later.</h5>
<ul>
<li><strong>ಗಿಡವಾಗಿ</strong> (Giḍavāgi) – As a plant/sapling</li>
<li><strong>ಬಗ್ಗದ್ದು</strong> (Baggadu) – Does not bend</li>
<li><strong>ಮರವಾಗಿ</strong> (Maravāgi) – As a tree</li>
<li><strong>ಬಗೀತೆ?</strong> (Bagīte?) – Will it bend?</li>
</ul>
<h6 id="giḍavāgi-baggadu-maravāgi-bagīte">Giḍavāgi baggadu, maravāgi bagīte?</h6>

###### ಗೆಳೆತನ

### ಗೆಳೆತನ ಸಹಬಾಳ್ವೆಗೆ ಸೋಪಾನ.

###### Friendship is the foundation for harmonious coexistence.

<aside class="notes"><h5 id="geḷetana-sahabāḷvege-sōpāna">Geḷetana sahabāḷvege sōpāna.</h5>
<ul>
<li><strong>ಗೆಳೆತನ</strong> (Geḷetana) – Friendship</li>
<li><strong>ಸಹಬಾಳ್ವೆಗೆ</strong> (Sahabāḷvege) – For coexistence / For living together</li>
<li><strong>ಸೋಪಾನ</strong> (Sōpāna) – Step / Foundation / Means</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಕುದುರೆ ಮತ್ತು ಒಂಟೆ ಒಳ್ಳೆಯ ಗೆಳೆಯರಾಗಿದ್ದವು.

###### The horse and the camel were good friends.

<aside class="notes"><h5 id="kudure-mattu-oṇṭe-oḷḷeya-geḷeyarāgiddavu">Kudure mattu oṇṭe oḷḷeya geḷeyarāgiddavu.</h5>
<ul>
<li><strong>ಕುದುರೆ</strong> (Kudure) – Horse</li>
<li><strong>ಮತ್ತು</strong> (Mattu) – And</li>
<li><strong>ಒಂಟೆ</strong> (Oṇṭe) – Camel</li>
<li><strong>ಒಳ್ಳೆಯ</strong> (Oḷḷeya) – Good</li>
<li><strong>ಗೆಳೆಯರು</strong> (Geḷeyaru) – Friends</li>
<li><strong>ಆಗಿದ್ದವು</strong> (Āgiddavu) – Were</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಒಂದೇ ಕಡೆ ವಾಸಿಸುತ್ತಿದ್ದವು.

###### They lived in the same place.

<aside class="notes"><h5 id="onde-kaḍe-vāsisuttiddavu">Onde kaḍe vāsisuttiddavu.</h5>
<ul>
<li><strong>ಒಂದೇ</strong> (Onde) – Same</li>
<li><strong>ಕಡೆ</strong> (Kaḍe) – Place / Side</li>
<li><strong>ವಾಸಿಸುತ್ತಿದ್ದವು</strong> (Vāsisuttiddavu) – Were living</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಜೊತೆಯಾಗಿಯೇ ಆಹಾರ ಹುಡುಕಿ ತಿನ್ನುತ್ತಿದ್ದವು.

###### They would search for food together and eat.

<aside class="notes"><h5 id="joteyāgiyē-āhāra-huḍuki-tinnuttiddavu">Joteyāgiyē āhāra huḍuki tinnuttiddavu.</h5>
<ul>
<li><strong>ಜೊತೆಯಾಗಿಯೇ</strong> (Joteyāgiyē) – Together</li>
<li><strong>ಆಹಾರ</strong> (Āhāra) – Food</li>
<li><strong>ಹುಡುಕಿ</strong> (Huḍuki) – Searching</li>
<li><strong>ತಿನ್ನುತ್ತಿದ್ದವು</strong> (Tinnuttiddavu) – Were eating</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಒಮ್ಮೆ ಕುದುರೆಗೆ ಒಂದು ಆಲೋಚನೆ ಬಂದಿತು.

###### One day, a thought came to the horse.

<aside class="notes"><h5 id="omme-kudurege-ondu-ālōchane-banditu">Omme kudurege ondu ālōchane banditu.</h5>
<ul>
<li><strong>ಒಮ್ಮೆ</strong> (Omme) – Once / One day</li>
<li><strong>ಕುದುರೆಗೆ</strong> (Kudurege) – To the horse</li>
<li><strong>ಒಂದು</strong> (Ondu) – One / A</li>
<li><strong>ಆಲೋಚನೆ</strong> (Ālōchane) – Thought / Idea</li>
<li><strong>ಬಂದಿತು</strong> (Banditu) – Came</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### "ನಮ್ಮಿಬ್ಬರಲ್ಲಿ ಯಾರು ಹೆಚ್ಚು"? ಎಂದು ಒಂಟೆಯನ್ನು ಕೇಳಿತು.

###### "Who is greater among us two?" it asked the camel.

<aside class="notes"><h5 id="nammibbaralli-yāru-heccu-endu-oṇṭeyannu-kēḷitu">&quot;Nammibbaralli yāru heccu?&quot; endu oṇṭeyannu kēḷitu.</h5>
<ul>
<li><strong>ನಮ್ಮಿಬ್ಬರಲ್ಲಿ</strong> (Nammibbaralli) – Between the two of us</li>
<li><strong>ಯಾರು</strong> (Yāru) – Who</li>
<li><strong>ಹೆಚ್ಚು</strong> (Heccu) – Greater / Superior</li>
<li><strong>ಎಂದು</strong> (Endu) – Saying / That</li>
<li><strong>ಒಂಟೆಯನ್ನು</strong> (Oṇṭeyannu) – The camel (object form)</li>
<li><strong>ಕೇಳಿತು</strong> (Kēḷitu) – Asked</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಅದಕ್ಕೆ ಒಂಟೆ "ಕುದುರೆಯಣ್ಣ, ನಾವಿಬ್ಬರೂ ಸಮಾನರು ಅಲ್ಲವೆ?" ಎಂದು ಹೇಳಿತು.

###### To that, the camel said "Brother horse, aren't we both equal?"

<aside class="notes"><h5 id="adakke-oṇṭe-kudureyaṇṇa-nāvibbarū-samānaru-allave-endu-hēḷitu">Adakke oṇṭe &quot;Kudureyaṇṇa, nāvibbarū samānaru allave?&quot; endu hēḷitu.</h5>
<ul>
<li><strong>ಅದಕ್ಕೆ</strong> (Adakke) – To that / In reply</li>
<li><strong>ಒಂಟೆ</strong> (Oṇṭe) – Camel</li>
<li><strong>ಕುದುರೆಯಣ್ಣ</strong> (Kudureyaṇṇa) – Brother horse</li>
<li><strong>ನಾವಿಬ್ಬರೂ</strong> (Nāvibbarū) – Both of us</li>
<li><strong>ಸಮಾನರು</strong> (Samānaru) – Equal</li>
<li><strong>ಅಲ್ಲವೆ?</strong> (Allave?) – Isn’t it?</li>
<li><strong>ಹೇಳಿತು</strong> (Hēḷitu) – Said</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಆ ಮಾತಿನಿಂದ ಕುದುರೆಗೆ ಸಮಾಧಾನವಾಗಲಿಲ್ಲ.

###### From those words, the horse was not satisfied.

<aside class="notes"><h5 id="ā-mātininda-kudurege-samādhānavāgalilla">Ā mātininda kudurege samādhānavāgalilla.</h5>
<ul>
<li><strong>ಆ</strong> (Ā) – That</li>
<li><strong>ಮಾತಿನಿಂದ</strong> (Mātininda) – From the words / speech</li>
<li><strong>ಕುದುರೆಗೆ</strong> (Kudurege) – To the horse</li>
<li><strong>ಸಮಾಧಾನ</strong> (Samādhāna) – Satisfaction</li>
<li><strong>ವಾಗಲಿಲ್ಲ</strong> (Vāgalilla) – Did not happen</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಆಗ ಅದು "ಆನೆಯಣ್ಣ ಅಲ್ಲಿದ್ದಾನೆ, ಅವನನ್ನೇ ಕೇಳೋಣ ಬಾ" ಎಂದಿತು.

###### Then it said, “Brother elephant is there, let’s ask him.”

<aside class="notes"><h5 id="āga-adu-āneyaṇṇa-alliddāne-avannē-kēḷōṇa-bā-enditu">Āga adu &quot;Āneyaṇṇa alliddāne, avannē kēḷōṇa bā&quot; enditu.</h5>
<ul>
<li><strong>ಆಗ</strong> (Āga) – Then</li>
<li><strong>ಅದು</strong> (Adu) – It</li>
<li><strong>ಆನೆಯಣ್ಣ</strong> (Āneyaṇṇa) – Brother elephant</li>
<li><strong>ಅಲ್ಲಿದ್ದಾನೆ</strong> (Alliddāne) – Is there</li>
<li><strong>ಅವನನ್ನೇ</strong> (Avannē) – Him only</li>
<li><strong>ಕೇಳೋಣ</strong> (Kēḷōṇa) – Let’s ask</li>
<li><strong>ಬಾ</strong> (Bā) – Come</li>
<li><strong>ಎಂದಿತು</strong> (Enditu) – Said</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಒಂಟೆ ಒಪ್ಪಿಕೊಂಡಿತು.

###### The camel agreed.

<aside class="notes"><h5 id="oṇṭe-oppikoṇḍitu">Oṇṭe oppikoṇḍitu.</h5>
<ul>
<li><strong>ಒಂಟೆ</strong> (Oṇṭe) – Camel</li>
<li><strong>ಒಪ್ಪಿಕೊಂಡಿತು</strong> (Oppikoṇḍitu) – Agreed / Accepted</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಅವು ಆನೆಯ ಬಳಿಗೆ ಹೋದವು.

###### They went to the elephant.

<aside class="notes"><h5 id="avu-āneya-baḷige-hōdavu">Avu āneya baḷige hōdavu.</h5>
<ul>
<li><strong>ಅವು</strong> (Avu) – They</li>
<li><strong>ಆನೆಯ</strong> (Āneya) – Of the elephant</li>
<li><strong>ಬಳಿಗೆ</strong> (Baḷige) – Near / Towards / To</li>
<li><strong>ಹೋದವು</strong> (Hōdavu) – Went</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಕುದುರೆಯು "ಆನೆಯಣ್ಣ, ನಮ್ಮಿಬ್ಬರಲ್ಲಿ ಯಾರು ಹೆಚ್ಚು ಎಂದು ನೀನು ಹೇಳಬೇಕು" ಎಂದು ಕೇಳಿತು.

###### The horse said, “Elephant brother, you must say who among us two is greater.”

<aside class="notes"><h5 id="kuḍureyu-āneyaṇṇa-nammibbaralli-yāru-heccu-endu-nīnu-hēḷabēku-endu-kēḷitu">Kuḍureyu &quot;Āneyaṇṇa, nammibbaralli yāru heccu endu nīnu hēḷabēku&quot; endu kēḷitu.</h5>
<ul>
<li><strong>ಕುದುರೆಯು</strong> (Kuḍureyu) – The horse</li>
<li><strong>ಆನೆಯಣ್ಣ</strong> (Āneyaṇṇa) – Elephant brother (respectful call)</li>
<li><strong>ನಮ್ಮಿಬ್ಬರಲ್ಲಿ</strong> (Nammibbaralli) – Between the two of us</li>
<li><strong>ಯಾರು</strong> (Yāru) – Who</li>
<li><strong>ಹೆಚ್ಚು</strong> (Heccu) – Greater / Superior</li>
<li><strong>ಎಂದು</strong> (Endu) – Saying / That</li>
<li><strong>ನೀನು</strong> (Nīnu) – You</li>
<li><strong>ಹೇಳಬೇಕು</strong> (Hēḷabēku) – Must say</li>
<li><strong>ಎಂದು ಕೇಳಿತು</strong> (Endu kēḷitu) – Said / Asked</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಆನೆಯು ಸ್ವಲ್ಪ ಹೊತ್ತು ಆಲೋಚಿಸಿ "ತಮ್ಮಂದಿರಾ, ಯಾರು ಹೆಚ್ಚು ಎಂದು ಸುಮ್ಮನೆ ಹೇಳುವುದು ಸರಿಯಲ್ಲ.

###### The elephant thought for a while and said, “Brothers, it is not right to simply say who is greater.

<aside class="notes"><h5 id="āneyu-svalpa-hotthu-ālōcisi-tammaṁdirā-yāru-heccu-endu-summane-hēḷuvudu-sariyalla">Āneyu svalpa hotthu ālōcisi &quot;Tammaṁdirā, yāru heccu endu summane hēḷuvudu sariyalla.&quot;</h5>
<ul>
<li><strong>ಆನೆಯು</strong> (Āneyu) – The elephant</li>
<li><strong>ಸ್ವಲ್ಪ ಹೊತ್ತು</strong> (Svalpa hotthu) – A little while</li>
<li><strong>ಆಲೋಚಿಸಿ</strong> (Ālōcisi) – Thought / Considered</li>
<li><strong>ತಮ್ಮಂದಿರಾ</strong> (Tammaṁdirā) – Brothers</li>
<li><strong>ಯಾರು</strong> (Yāru) – Who</li>
<li><strong>ಹೆಚ್ಚು</strong> (Heccu) – Greater</li>
<li><strong>ಸುಮ್ಮನೆ</strong> (Summane) – Simply / Without reason</li>
<li><strong>ಹೇಳುವುದು</strong> (Hēḷuvudu) – Saying</li>
<li><strong>ಸರಿಯಲ್ಲ</strong> (Sariyalla) – Is not right</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ನಿಮ್ಮಿಬ್ಬರಿಗೆ ಓಟದ ಸ್ಪರ್ಧೆ ಏರ್ಪಡಿಸೋಣ.

###### Let’s arrange a running competition for you both.

<aside class="notes"><h5 id="nimmibbarige-ōṭada-spardhe-ēṛpaḍisōṇa">Nimmibbarige ōṭada spardhe ēṛpaḍisōṇa.</h5>
<ul>
<li><strong>ನಿಮ್ಮಿಬ್ಬರಿಗೆ</strong> (Nimmibbarige) – For both of you</li>
<li><strong>ಓಟದ</strong> (Ōṭada) – Of running / Race</li>
<li><strong>ಸ್ಪರ್ಧೆ</strong> (Spardhe) – Competition</li>
<li><strong>ಏರ್ಪಡಿಸೋಣ</strong> (Ēṛpaḍisōṇa) – Let’s arrange</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಆದರೆ ಸ್ಪರ್ಧೆಯು ಎರಡು ಸಲ ಇರಲಿ, ಅನಂತರ ತೀರ್ಮಾನಿಸೋಣ" ಎಂಬ ಸಲಹೆಯನ್ನು ನೀಡಿತು.

###### “But let the competition be held twice, and then we shall decide,” it suggested.

<aside class="notes"><h5 id="ādare-spardheyu-eraḍu-sala-irali-anantara-tīrmāṇisōṇa-emba-salahēyannu-nīḍitu">Ādare spardheyu eraḍu sala irali, anantara tīrmāṇisōṇa&quot; emba salahēyannu nīḍitu.</h5>
<ul>
<li><strong>ಆದರೆ</strong> (Ādare) – But</li>
<li><strong>ಸ್ಪರ್ಧೆಯು</strong> (Spardheyu) – The competition</li>
<li><strong>ಎರಡು ಸಲ</strong> (Eraḍu sala) – Twice / Two times</li>
<li><strong>ಇರಲಿ</strong> (Irali) – Let it be / Should be</li>
<li><strong>ಅನಂತರ</strong> (Anantara) – Afterwards</li>
<li><strong>ತೀರ್ಮಾನಿಸೋಣ</strong> (Tīrmāṇisōṇa) – Let us decide</li>
<li><strong>ಎಂಬ</strong> (Emba) – Saying</li>
<li><strong>ಸಲಹೆಯನ್ನು</strong> (Salahēyannu) – Suggestion</li>
<li><strong>ನೀಡಿತು</strong> (Nīḍitu) – Gave</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಸ್ನೇಹಿತರಿಬ್ಬರೂ ಒಪ್ಪಿಕೊಂಡರು.

###### Both friends agreed.

<aside class="notes"><h5 id="snēhitaribbarū-oppikoṇḍaru">Snēhitaribbarū oppikoṇḍaru.</h5>
<ul>
<li><strong>ಸ್ನೇಹಿತರು</strong> (Snēhitaru) – Friends</li>
<li><strong>ಇಬ್ಬರೂ</strong> (Ibbarū) – Both</li>
<li><strong>ಒಪ್ಪಿಕೊಂಡರು</strong> (Oppikoṇḍaru) – Agreed</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಆನೆಯು ಸ್ಪರ್ಧೆಯ ಜಾಗ ಮತ್ತು ಸಮಯವನ್ನು ನಿರ್ಧರಿಸಿತು.

###### The elephant decided the place and time of the competition.

<aside class="notes"><h5 id="āneyu-spardheya-jāga-mattu-samayavannu-nirdharisitu">Āneyu spardheya jāga mattu samayavannu nirdharisitu.</h5>
<ul>
<li><strong>ಆನೆಯು</strong> (Āneyu) – The elephant</li>
<li><strong>ಸ್ಪರ್ಧೆಯ</strong> (Spardheya) – Of the competition</li>
<li><strong>ಜಾಗ</strong> (Jāga) – Place / Location</li>
<li><strong>ಮತ್ತು</strong> (Mattu) – And</li>
<li><strong>ಸಮಯವನ್ನು</strong> (Samayavannu) – Time (object form)</li>
<li><strong>ನಿರ್ಧರಿಸಿತು</strong> (Nirdharisitu) – Decided / Fixed</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### "ನೀವು ಈ ಬೇವಿನ ಮರದಿಂದ ಆರಂಭಿಸಿ, ಆ ಕೊಳದವರೆಗೆ ಓಡಿ.

###### “You start from this neem tree and run till that pond.

<aside class="notes"><h5 id="nīvu-ī-bēvina-maradinda-ārambhisi-ā-koḷadavarege-ōḍi">&quot;Nīvu ī bēvina maradinda ārambhisi, ā koḷadavarege ōḍi.</h5>
<ul>
<li><strong>ನೀವು</strong> (Nīvu) – You (plural / respectful)</li>
<li><strong>ಈ</strong> (Ī) – This</li>
<li><strong>ಬೇವಿನ</strong> (Bēvina) – Of the neem (tree)</li>
<li><strong>ಮರದಿಂದ</strong> (Maradinda) – From the tree</li>
<li><strong>ಆರಂಭಿಸಿ</strong> (Ārambhisi) – Start / Begin</li>
<li><strong>ಆ</strong> (Ā) – That</li>
<li><strong>ಕೊಳದವರೆಗೆ</strong> (Koḷadavarege) – Up to the pond</li>
<li><strong>ಓಡಿ</strong> (Ōḍi) – Run</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ನಾನು ಕೊಳದ ಹತ್ತಿರ ಇರುತ್ತೇನೆ" ಎಂಬ ಸೂಚನೆ ನೀಡಿತು.

###### “I will be near the pond,” it instructed.

<aside class="notes"><h5 id="nānu-koḷada-hattira-iruttēne-emba-sūcane-nīḍitu">Nānu koḷada hattira iruttēne&quot; emba sūcane nīḍitu.</h5>
<ul>
<li><strong>ನಾನು</strong> (Nānu) – I</li>
<li><strong>ಕೊಳದ</strong> (Koḷada) – Of the pond</li>
<li><strong>ಹತ್ತಿರ</strong> (Hattira) – Near / Close to</li>
<li><strong>ಇರುತ್ತೇನೆ</strong> (Iruttēne) – Will be</li>
<li><strong>ಎಂಬ</strong> (Emba) – Saying / That</li>
<li><strong>ಸೂಚನೆ</strong> (Sūcane) – Instruction / Direction</li>
<li><strong>ನೀಡಿತು</strong> (Nīḍitu) – Gave</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಆನೆಯು ಅಲ್ಲಿಗೆ ಹೋಯಿತು.

###### The elephant went there.

<aside class="notes"><h5 id="āneyu-allige-hōyitu">Āneyu allige hōyitu.</h5>
<ul>
<li><strong>ಆನೆಯು</strong> (Āneyu) – The elephant</li>
<li><strong>ಅಲ್ಲಿಗೆ</strong> (Allige) – There / To that place</li>
<li><strong>ಹೋಯಿತು</strong> (Hōyitu) – Went</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಕುದುರೆ ಮತ್ತು ಒಂಟೆ ಓಡಲು ಶುರು ಮಾಡಿದವು.

###### The horse and the camel started running.

<aside class="notes"><h5 id="kudure-mattu-oṇṭe-ōḍalu-śuru-mādidavu">Kudure mattu oṇṭe ōḍalu śuru mādidavu.</h5>
<ul>
<li><strong>ಕುದುರೆ</strong> (Kudure) – Horse</li>
<li><strong>ಮತ್ತು</strong> (Mattu) – And</li>
<li><strong>ಒಂಟೆ</strong> (Oṇṭe) – Camel</li>
<li><strong>ಓಡಲು</strong> (Ōḍalu) – To run</li>
<li><strong>ಶುರು</strong> (Śuru) – Start / Beginning</li>
<li><strong>ಮಾಡಿದವು</strong> (Mādidavu) – Did / Started</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಕುದುರೆಯೇ ವೇಗವಾಗಿ ಓಡಿ ಮೊದಲು ಗುರಿ ಮುಟ್ಟಿತು.

###### The horse ran fast and reached the goal first.

<aside class="notes"><h5 id="kudureyē-vēgavāgi-ōḍi-modalū-guri-muṭṭitu">Kudureyē vēgavāgi ōḍi modalū guri muṭṭitu.</h5>
<ul>
<li><strong>ಕುದುರೆಯೇ</strong> (Kudureyē) – The horse itself</li>
<li><strong>ವೇಗವಾಗಿ</strong> (Vēgavāgi) – Fast / Quickly</li>
<li><strong>ಓಡಿ</strong> (Ōḍi) – Ran</li>
<li><strong>ಮೊದಲು</strong> (Modalu) – First</li>
<li><strong>ಗುರಿ</strong> (Guri) – Goal / Target</li>
<li><strong>ಮುಟ್ಟಿತು</strong> (Muṭṭitu) – Reached</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಗೆದ್ದ ಕುದುರೆ "ನೋಡಿದಿರಾ! ನಾನೇ ಹೆಚ್ಚು ಅಂತ ಗೊತ್ತಾಯಿತೆ?" ಎಂದು ಜಂಬದಿಂದ ಹೇಳಿತು.

###### The winning horse said proudly, “See! Didn’t you realize that I am greater?”

<aside class="notes"><h5 id="gedda-kudure-nōḍidirā-nānē-heccu-anta-gottāyite-endu-jambadinda-hēlitu">Gedda kudure &quot;Nōḍidirā! Nānē heccu anta gottāyite?&quot; endu jambadinda hēlitu.</h5>
<ul>
<li><strong>ಗೆದ್ದ</strong> (Gedda) – Won / Victorious</li>
<li><strong>ಕುದುರೆ</strong> (Kudure) – Horse</li>
<li><strong>ನೋಡಿದಿರಾ</strong> (Nōḍidirā) – Did you see?</li>
<li><strong>ನಾನೇ</strong> (Nānē) – I myself</li>
<li><strong>ಹೆಚ್ಚು</strong> (Heccu) – More / Greater</li>
<li><strong>ಅಂತ</strong> (Anta) – That / As</li>
<li><strong>ಗೊತ್ತಾಯಿತೆ</strong> (Gottāyite) – Became known / Realized</li>
<li><strong>ಎಂದು</strong> (Endu) – Saying / That</li>
<li><strong>ಜಂಬದಿಂದ</strong> (Jambadinda) – With pride / Arrogantly</li>
<li><strong>ಹೇಳಿತು</strong> (Hēlitu) – Said</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಆನೆಯು "ಕುದುರೆಯೇ, ನಮ್ಮ ಒಪ್ಪಂದದಂತೆ ಇನ್ನೊಂದು ಕಡೆ ಸ್ಪರ್ಧೆ ಇದೆ.

###### The elephant said, “Horse, as per our agreement, there is another race in another place.

<aside class="notes"><h5 id="āneyu-kudureyē-namma-oppandadaṃte-innondu-kaḍe-spardhe-ide">Āneyu &quot;Kudureyē, namma oppandadaṃte innondu kaḍe spardhe ide.</h5>
<ul>
<li><strong>ಆನೆಯು</strong> (Āneyu) – The elephant</li>
<li><strong>ಕುದುರೆಯೇ</strong> (Kudureyē) – O horse</li>
<li><strong>ನಮ್ಮ</strong> (Namma) – Our</li>
<li><strong>ಒಪ್ಪಂದದಂತೆ</strong> (Oppandadaṃte) – As per the agreement</li>
<li><strong>ಇನ್ನೊಂದು</strong> (Innondu) – Another</li>
<li><strong>ಕಡೆ</strong> (Kaḍe) – Place / Side</li>
<li><strong>ಸ್ಪರ್ಧೆ</strong> (Spardhe) – Competition / Race</li>
<li><strong>ಇದೆ</strong> (Ide) – Exists / Is there</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಅದೂ ಆಗಲಿ, ಅನಂತರ ಯಾರು ಹೆಚ್ಚು ಎಂಬುದನ್ನು ತೀರ್ಮಾನಿಸಬಹುದು" ಎಂದಿತು.

###### Let that also happen, then we can decide who is greater,” it said.

<aside class="notes"><h5 id="adū-āgali-anantara-yāru-heccu-embudannu-tīrmāṇisabahudu-enditu">Adū āgali, anantara yāru heccu embudannu tīrmāṇisabahudu&quot; enditu.</h5>
<ul>
<li><strong>ಅದೂ</strong> (Adū) – That also</li>
<li><strong>ಆಗಲಿ</strong> (Āgali) – Let happen</li>
<li><strong>ಅನಂತರ</strong> (Anantara) – Afterwards / Then</li>
<li><strong>ಯಾರು</strong> (Yāru) – Who</li>
<li><strong>ಹೆಚ್ಚು</strong> (Heccu) – More / Greater</li>
<li><strong>ಎಂಬುದನ್ನು</strong> (Embudannu) – That (object form)</li>
<li><strong>ತೀರ್ಮಾನಿಸಬಹುದು</strong> (Tīrmāṇisabahudu) – Can decide</li>
<li><strong>ಎಂದಿತು</strong> (Enditu) – Said</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### "ಓಹೋ! ಹಾಗೆಯೇ ಆಗಲಿ, ನಾನು ಸಿದ್ಧ" ಎಂದು ಕುದುರೆ ಹೆಮ್ಮೆಯಿಂದ ಹೇಳಿತು.

###### “Oh! Let it be so, I am ready,” said the horse proudly.

<aside class="notes"><h5 id="ōhō-hāgeyē-āgali-nānu-siddha-endu-kudure-hemmeyinda-hēlitu">&quot;Ōhō! Hāgeyē āgali, nānu siddha&quot; endu kudure hemmeyinda hēlitu.</h5>
<ul>
<li><strong>ಓಹೋ</strong> (Ōhō) – Oh! (expression)</li>
<li><strong>ಹಾಗೆಯೇ</strong> (Hāgeyē) – Just like that / As it is</li>
<li><strong>ಆಗಲಿ</strong> (Āgali) – Let it happen</li>
<li><strong>ನಾನು</strong> (Nānu) – I</li>
<li><strong>ಸಿದ್ಧ</strong> (Siddha) – Ready</li>
<li><strong>ಎಂದು</strong> (Endu) – Saying / That</li>
<li><strong>ಕುದುರೆ</strong> (Kudure) – Horse</li>
<li><strong>ಹೆಮ್ಮೆಯಿಂದ</strong> (Hemmeyinda) – With pride</li>
<li><strong>ಹೇಳಿತು</strong> (Hēlitu) – Said</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಆನೆಯು ಎರಡನೆಯ ಸಲದ ಓಟದ ಸ್ಪರ್ಧೆಯನ್ನು ಹೆಚ್ಚು ಮರಳು ಇರುವ ಜಾಗದಲ್ಲಿ ಏರ್ಪಡಿಸಿತು.

###### The elephant arranged the second running competition in a place with more sand.

<aside class="notes"><h5 id="āneyu-eraḍaneya-salad-ōṭada-spardheyannu-heccu-maraḷu-iruva-jāgadalli-ēṛpaḍisitu">Āneyu eraḍaneya salad ōṭada spardheyannu heccu maraḷu iruva jāgadalli ēṛpaḍisitu.</h5>
<ul>
<li><strong>ಆನೆಯು</strong> (Āneyu) – The elephant</li>
<li><strong>ಎರಡನೆಯ</strong> (Eraḍaneya) – Second</li>
<li><strong>ಸಲದ</strong> (Salada) – Time / Occasion</li>
<li><strong>ಓಟದ</strong> (Ōṭada) – Of running / Race</li>
<li><strong>ಸ್ಪರ್ಧೆಯನ್ನು</strong> (Spardheyannu) – Competition (object form)</li>
<li><strong>ಹೆಚ್ಚು</strong> (Heccu) – More</li>
<li><strong>ಮರಳು</strong> (Maraḷu) – Sand</li>
<li><strong>ಇರುವ</strong> (Iruva) – Existing / With</li>
<li><strong>ಜಾಗದಲ್ಲಿ</strong> (Jāgadalli) – In the place</li>
<li><strong>ಏರ್ಪಡಿಸಿತು</strong> (Ēṛpaḍisitu) – Arranged / Organized</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಅಲ್ಲಿ ಸ್ಪರ್ಧೆಯ ಆರಂಭ ಮತ್ತು ಗುರಿ ಮುಟ್ಟುವ ಜಾಗಗಳನ್ನು ಗುರುತಿಸಿತು.

###### There it marked the places for the start and finish of the competition.

<aside class="notes"><h5 id="alli-spardheya-ārambha-mattu-guri-muṭṭuva-jāgagaḷannu-gurutisitu">Alli spardheya ārambha mattu guri muṭṭuva jāgagaḷannu gurutisitu.</h5>
<ul>
<li><strong>ಅಲ್ಲಿ</strong> (Alli) – There</li>
<li><strong>ಸ್ಪರ್ಧೆಯ</strong> (Spardheya) – Of the competition</li>
<li><strong>ಆರಂಭ</strong> (Ārambha) – Start / Beginning</li>
<li><strong>ಮತ್ತು</strong> (Mattu) – And</li>
<li><strong>ಗುರಿ</strong> (Guri) – Goal / Target</li>
<li><strong>ಮುಟ್ಟುವ</strong> (Muṭṭuva) – Reaching</li>
<li><strong>ಜಾಗಗಳನ್ನು</strong> (Jāgagaḷannu) – Places (object form)</li>
<li><strong>ಗುರುತಿಸಿತು</strong> (Gurutisitu) – Marked / Identified</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಗುರಿ ಮುಟ್ಟಬೇಕಾದ ಸ್ಥಳದಲ್ಲಿ ಆನೆಯು ನಿಂತಿತು.

###### At the place where the goal was to be reached, the elephant stood.

<aside class="notes"><h5 id="guri-muṭṭabēkāda-sthaladalli-āneyu-nintitu">Guri muṭṭabēkāda sthaladalli āneyu nintitu.</h5>
<ul>
<li><strong>ಗುರಿ</strong> (Guri) – Goal / Target</li>
<li><strong>ಮುಟ್ಟಬೇಕಾದ</strong> (Muṭṭabēkāda) – That had to be reached</li>
<li><strong>ಸ್ಥಳದಲ್ಲಿ</strong> (Sthaladalli) – In the place</li>
<li><strong>ಆನೆಯು</strong> (Āneyu) – The elephant</li>
<li><strong>ನಿಂತಿತು</strong> (Nintitu) – Stood</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಓಟದ ಸ್ಪರ್ಧೆ ಪ್ರಾರಂಭವಾಯಿತು.

###### The running competition began.

<aside class="notes"><h5 id="ōṭada-spardhe-prārambhavāyitu">Ōṭada spardhe prārambhavāyitu.</h5>
<ul>
<li><strong>ಓಟದ</strong> (Ōṭada) – Running / Race</li>
<li><strong>ಸ್ಪರ್ಧೆ</strong> (Spardhe) – Competition</li>
<li><strong>ಪ್ರಾರಂಭವಾಯಿತು</strong> (Prārambhavāyitu) – Began / Started</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಮರಳಿನ ಮೇಲೆ ಒಂಟೆ ಸರಾಗವಾಗಿ ಓಡಿತು.

###### The camel ran smoothly on the sand.

<aside class="notes"><h5 id="maraḷina-mēle-oṇṭe-sarāgavāgi-ōḍitu">Maraḷina mēle oṇṭe sarāgavāgi ōḍitu.</h5>
<ul>
<li><strong>ಮರಳಿನ</strong> (Maraḷina) – Of the sand</li>
<li><strong>ಮೇಲೆ</strong> (Mēle) – On / Over</li>
<li><strong>ಒಂಟೆ</strong> (Oṇṭe) – Camel</li>
<li><strong>ಸರಾಗವಾಗಿ</strong> (Sarāgavāgi) – Smoothly / Easily</li>
<li><strong>ಓಡಿತು</strong> (Ōḍitu) – Ran</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಆದರೆ ಅಲ್ಲಿ ಕುದುರೆಗೆ ಓಡಲು ಕಷ್ಟವಾಯಿತು.

###### But there, it was difficult for the horse to run.

<aside class="notes"><h5 id="ādare-alli-kudurege-ōḍalu-kaṣṭavāyitu">Ādare alli kudurege ōḍalu kaṣṭavāyitu.</h5>
<ul>
<li><strong>ಆದರೆ</strong> (Ādare) – But / However</li>
<li><strong>ಅಲ್ಲಿ</strong> (Alli) – There</li>
<li><strong>ಕುದುರೆಗೆ</strong> (Kudurege) – For the horse</li>
<li><strong>ಓಡಲು</strong> (Ōḍalu) – To run</li>
<li><strong>ಕಷ್ಟವಾಯಿತು</strong> (Kaṣṭavāyitu) – Became difficult</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಎರಡನೆಯ ಸಲ ಓಟದ ಸ್ಪರ್ಧೆಯಲ್ಲಿ ಒಂಟೆ ಗೆದ್ದಿತು.

###### In the second race, the camel won.

<aside class="notes"><h5 id="eraḍaneya-sala-ōṭada-spardheyalli-oṇṭe-gedditu">Eraḍaneya sala ōṭada spardheyalli oṇṭe gedditu.</h5>
<ul>
<li><strong>ಎರಡನೆಯ</strong> (Eraḍaneya) – Second</li>
<li><strong>ಸಲ</strong> (Sala) – Time / Occasion</li>
<li><strong>ಓಟದ</strong> (Ōṭada) – Running / Race</li>
<li><strong>ಸ್ಪರ್ಧೆಯಲ್ಲಿ</strong> (Spardheyalli) – In the competition</li>
<li><strong>ಒಂಟೆ</strong> (Oṇṭe) – Camel</li>
<li><strong>ಗೆದ್ದಿತು</strong> (Gedditu) – Won</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಆಗ ಸೋತ ಕುದುರೆಗೆ ತನ್ನ ತಪ್ಪಿನ ಅರಿವಾಯಿತು.

###### Then the defeated horse realized its mistake.

<aside class="notes"><h5 id="āga-sōta-kudurege-tanna-tappina-arivāyitu">Āga sōta kudurege tanna tappina arivāyitu.</h5>
<ul>
<li><strong>ಆಗ</strong> (Āga) – Then</li>
<li><strong>ಸೋತ</strong> (Sōta) – Defeated / Lost</li>
<li><strong>ಕುದುರೆಗೆ</strong> (Kudurege) – To the horse</li>
<li><strong>ತನ್ನ</strong> (Tanna) – Its own</li>
<li><strong>ತಪ್ಪಿನ</strong> (Tappina) – Mistake’s / Of mistake</li>
<li><strong>ಅರಿವಾಯಿತು</strong> (Arivāyitu) – Realized</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಆನೆ ಮತ್ತು ಒಂಟೆಯ ಹತ್ತಿರ ಕ್ಷಮೆ ಕೇಳಿತು.

###### It asked forgiveness from the elephant and the camel.

<aside class="notes"><h5 id="āne-mattu-oṇṭeya-hattira-kṣame-kēḷitu">Āne mattu oṇṭeya hattira kṣame kēḷitu.</h5>
<ul>
<li><strong>ಆನೆ</strong> (Āne) – Elephant</li>
<li><strong>ಮತ್ತು</strong> (Mattu) – And</li>
<li><strong>ಒಂಟೆಯ</strong> (Oṇṭeya) – Of the camel</li>
<li><strong>ಹತ್ತಿರ</strong> (Hattira) – Near / To</li>
<li><strong>ಕ್ಷಮೆ</strong> (Kṣame) – Forgiveness</li>
<li><strong>ಕೇಳಿತು</strong> (Kēḷitu) – Asked</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಆನೆಯು "ತಮ್ಮಂದಿರಾ, ನಿಮ್ಮಲ್ಲಿ ಯಾರು ಹೆಚ್ಚ ಅಲ್ಲ, ಕಡಿಮೆಯೂ ಅಲ್ಲ.

###### The elephant said, “Brothers, neither of you is greater nor lesser.

<aside class="notes"><h5 id="āneyu-tammandirā-nimmalli-yāru-hecca-alla-kaḍimeyū-alla">Āneyu &quot;Tammandirā, nim’malli yāru hecca alla, kaḍimeyū alla.</h5>
<ul>
<li><strong>ಆನೆಯು</strong> (Āneyu) – The elephant</li>
<li><strong>ತಮ್ಮಂದಿರಾ</strong> (Tammandirā) – Brothers / Dear ones</li>
<li><strong>ನಿಮ್ಮಲ್ಲಿ</strong> (Nim’malli) – Among you</li>
<li><strong>ಯಾರು</strong> (Yāru) – Who</li>
<li><strong>ಹೆಚ್ಚ</strong> (Hecca) – Greater / More</li>
<li><strong>ಅಲ್ಲ</strong> (Alla) – Not</li>
<li><strong>ಕಡಿಮೆಯೂ</strong> (Kaḍimeyū) – Lesser also</li>
<li><strong>ಅಲ್ಲ</strong> (Alla) – Not</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಪ್ರತಿಯೊಬ್ಬರಲ್ಲಿಯೂ ಅವರದೇ ಆದ ವಿಶೇಷತೆ ಇರುತ್ತದೆ.

###### Everyone has their own special quality.

<aside class="notes"><h5 id="pratiyobbaralliyū-avarade-āda-viśēṣate-iruttade">Pratiyobbaralliyū avarade āda viśēṣate iruttade.</h5>
<ul>
<li><strong>ಪ್ರತಿಯೊಬ್ಬರಲ್ಲಿಯೂ</strong> (Pratiyobbaralliyū) – In each one / Everyone</li>
<li><strong>ಅವರದೇ</strong> (Avarade) – Their own</li>
<li><strong>ಆದ</strong> (Āda) – Of / Belonging</li>
<li><strong>ವಿಶೇಷತೆ</strong> (Viśēṣate) – Specialty / Uniqueness</li>
<li><strong>ಇರುತ್ತದೆ</strong> (Iruttade) – Exists / Is there</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ನೀವಿಬ್ಬರೂ ಒಳ್ಳೆಯ ಗೆಳೆಯರಾಗಿದ್ದವರು.

###### Both of you were good friends.

<aside class="notes"><h5 id="nīvibbarū-oḷḷeya-geḷeyarāgiddavaru">Nīvibbarū oḷḷeya geḷeyarāgiddavaru.</h5>
<ul>
<li><strong>ನೀವಿಬ್ಬರೂ</strong> (Nīvibbarū) – Both of you</li>
<li><strong>ಒಳ್ಳೆಯ</strong> (Oḷḷeya) – Good</li>
<li><strong>ಗೆಳೆಯರಾಗಿದ್ದವರು</strong> (Geḷeyarāgiddavaru) – Were friends</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಮುಂದೆಯೂ ಹಾಗೆಯೇ ಇರಿ.

###### Continue to be so in the future too.

<aside class="notes"><h5 id="mundeyū-hāgeyē-iri">Mundeyū hāgeyē iri.</h5>
<ul>
<li><strong>ಮುಂದೆಯೂ</strong> (Mundeyū) – In the future also</li>
<li><strong>ಹಾಗೆಯೇ</strong> (Hāgeyē) – Like this / The same way</li>
<li><strong>ಇರಿ</strong> (Iri) – Be / Remain</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಗೆಳೆತನದ ಆನಂದವನ್ನು ಹಂಚಿಕೊಂಡು ಬಾಳಿರಿ" ಎಂದು ಹೇಳಿತು.

###### “Live by sharing the joy of friendship,” it said.

<aside class="notes"><h5 id="geḷetanada-ānandavannu-hañcikoṇḍu-bāḷiri-endu-hēlitu">Geḷetanada ānandavannu hañcikoṇḍu bāḷiri&quot; endu hēlitu.</h5>
<ul>
<li><strong>ಗೆಳೆತನದ</strong> (Geḷetanada) – Of friendship</li>
<li><strong>ಆನಂದವನ್ನು</strong> (Ānandavannu) – Joy (object form)</li>
<li><strong>ಹಂಚಿಕೊಂಡು</strong> (Hañcikoṇḍu) – Sharing</li>
<li><strong>ಬಾಳಿರಿ</strong> (Bāḷiri) – Live</li>
<li><strong>ಎಂದು</strong> (Endu) – Saying</li>
<li><strong>ಹೇಳಿತು</strong> (Hēlitu) – Said</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಕುದುರೆ ಮತ್ತು ಒಂಟೆ ಆನೆಗೆ ಧನ್ಯವಾದಗಳನ್ನು ತಿಳಿಸಿದವು.

###### The horse and the camel thanked the elephant.

<aside class="notes"><h5 id="kudure-mattu-oṇṭe-ānege-dhanyavādagaḷannu-tiḷisidavu">Kudure mattu oṇṭe ānege dhanyavādagaḷannu tiḷisidavu.</h5>
<ul>
<li><strong>ಕುದುರೆ</strong> (Kudure) – Horse</li>
<li><strong>ಮತ್ತು</strong> (Mattu) – And</li>
<li><strong>ಒಂಟೆ</strong> (Oṇṭe) – Camel</li>
<li><strong>ಆನೆಗೆ</strong> (Ānege) – To the elephant</li>
<li><strong>ಧನ್ಯವಾದಗಳನ್ನು</strong> (Dhanyavādagaḷannu) – Thanks (object form)</li>
<li><strong>ತಿಳಿಸಿದವು</strong> (Tiḷisidavu) – Conveyed / Gave</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಗೆಳೆತನ

### ಎಂದಿನಂತೆ ಗೆಳೆಯರಾಗಿ ಖುಷಿಯಾಗಿದ್ದವು.

###### As always, they were happy as friends.

<aside class="notes"><h5 id="endinante-geḷeyarāgi-khuṣiyāgiddavu">Endinante geḷeyarāgi khuṣiyāgiddavu.</h5>
<ul>
<li><strong>ಎಂದಿನಂತೆ</strong> (Endinante) – As usual / As always</li>
<li><strong>ಗೆಳೆಯರಾಗಿ</strong> (Geḷeyarāgi) – As friends</li>
<li><strong>ಖುಷಿಯಾಗಿದ್ದವು</strong> (Khuṣiyāgiddavu) – Were happy</li>
</ul>
</aside></script></section></section><section  data-markdown><script type="text/template">
