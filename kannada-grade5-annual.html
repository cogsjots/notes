###### ಸ್ವಂತ ವಾಕ್ಯಗಳು
### ೧. ಕಡಲು

Sea

<aside class="notes"><p>kaḍalu</p>
</aside></script></section><section data-markdown><script type="text/template">
<!-- .slide: data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

೧. ಕಡಲು
### ಕಡಲು ನೋಡಲು ಸುಂದರವಾಗಿರುತ್ತದೆ.

<aside class="notes"><h5 id="kaḍalu-nōḍalu-sundaravāgiruttade">Kaḍalu nōḍalu sundaravāgiruttade.</h5>
<p>The sea is beautiful to look at.</p>
<ul>
<li><strong>ಕಡಲು (kaḍalu)</strong> – Sea / Ocean</li>
<li><strong>ನೋಡಲು (nōḍalu)</strong> – To see / To look at</li>
<li><strong>ಸುಂದರವಾಗಿರುತ್ತದೆ (sundaravāgiruttade)</strong> – Is beautiful / Remains beautiful</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">
###### ಸ್ವಂತ ವಾಕ್ಯಗಳು

### ೨. ಸಹಾಯ

Help

<aside class="notes"><p>sahāya</p>
</aside></script></section><section data-markdown><script type="text/template">
<!-- .slide: data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

೨. ಸಹಾಯ

### ನನಗೆ ನನ್ನ ಗೆಳೆಯ ಸಹಾಯ ಮಾಡಿದ.

<aside class="notes"><h5 id="nanage-nanna-geḷeya-sahāya-māḍida">Nanage nanna geḷeya sahāya māḍida.</h5>
<p>My friend helped me.</p>
<ul>
<li><strong>ನನಗೆ (nanage)</strong> – To me / For me</li>
<li><strong>ನನ್ನ (nanna)</strong> – My</li>
<li><strong>ಗೆಳೆಯ (geḷeya)</strong> – Friend</li>
<li><strong>ಸಹಾಯ (sahāya)</strong> – Help</li>
<li><strong>ಮಾಡಿದ (māḍida)</strong> – Did / Helped</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಸ್ವಂತ ವಾಕ್ಯಗಳು

### ೩. ಪ್ರಾಣಿ

Animal

<aside class="notes"><p>hasu</p>
</aside></script></section><section data-markdown><script type="text/template">
<!-- .slide: data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

೩. ಪ್ರಾಣಿ

### ಹಸು ಒಂದು ಸಾಕುಪ್ರಾಣಿ.

<aside class="notes"><h5 id="hasu-ondu-sākupreāṇi">Hasu ondu sākupreāṇi.</h5>
<p>The cow is a domestic animal.</p>
<ul>
<li><strong>ಹಸು (hasu)</strong> – Cow</li>
<li><strong>ಒಂದು (ondu)</strong> – One / A</li>
<li><strong>ಸಾಕುಪ್ರಾಣಿ (sākupreāṇi)</strong> – Domestic animal / Pet</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಸ್ವಂತ ವಾಕ್ಯಗಳು

### ೪. ಕಾಡು

Forest

<aside class="notes"><p>kaadu</p>
</aside></script></section><section data-markdown><script type="text/template">
<!-- .slide: data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

೪. ಕಾಡು

### ಸಿಂಹ ಕಾಡಿನಲ್ಲಿ ವಾಸಿಸುತ್ತದೆ.

<aside class="notes"><h5 id="simha-kāḍinalli-vāsisuttade">Simha kāḍinalli vāsisuttade.</h5>
<p>The lion lives in the forest.</p>
<ul>
<li><strong>ಸಿಂಹ (simha)</strong> – Lion</li>
<li><strong>ಕಾಡಿನಲ್ಲಿ (kāḍinalli)</strong> – In the forest</li>
<li><strong>ವಾಸಿಸುತ್ತದೆ (vāsisuttade)</strong> – Lives / Resides</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಸ್ವಂತ ವಾಕ್ಯಗಳು

### ೫. ಸುಂದರ

Beautiful

<aside class="notes"><p>sundara</p>
</aside></script></section><section data-markdown><script type="text/template">
<!-- .slide: data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

೫. ಸುಂದರ

### ನವಿಲಿನ ನಾಟ್ಯ ಸುಂದರವಾಗಿರುತ್ತದೆ.

<aside class="notes"><h5 id="navilina-nāṭya-sundaravāgiruttade">Navilina nāṭya sundaravāgiruttade.</h5>
<p>The dance of the peacock is beautiful.</p>
<ul>
<li><strong>ನವಿಲಿನ (navilina)</strong> – Peacock&#39;s</li>
<li><strong>ನಾಟ್ಯ (nāṭya)</strong> – Dance</li>
<li><strong>ಸುಂದರವಾಗಿರುತ್ತದೆ (sundaravāgiruttade)</strong> – Is beautiful / Remains beautiful</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಸ್ವಂತ ವಾಕ್ಯಗಳು

### ೬. ನೀರು

Water

<aside class="notes"><p>neeru</p>
</aside></script></section><section data-markdown><script type="text/template">
<!-- .slide: data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

೬. ನೀರು

### ನಾವು ಬದುಕಲು ನೀರು ಬೇಕೇ ಬೇಕು.

<aside class="notes"><h5 id="nāvu-badukalu-nīru-bēkē-bēku">Nāvu badukalu nīru bēkē bēku.</h5>
<p>We definitely need water to survive.</p>
<ul>
<li><strong>ನಾವು (nāvu)</strong> – We</li>
<li><strong>ಬದುಕಲು (badukalu)</strong> – To live / To survive</li>
<li><strong>ನೀರು (nīru)</strong> – Water</li>
<li><strong>ಬೇಕೇ ಬೇಕು (bēkē bēku)</strong> – Definitely needed</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಸ್ವಂತ ವಾಕ್ಯಗಳು

### ೭. ನದಿ

River

<aside class="notes"><p>nadi</p>
</aside></script></section><section data-markdown><script type="text/template">
<!-- .slide: data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

೭. ನದಿ

### ಕಾವೇರಿ ನದಿ ತಲಕಾವೇರಿಯಲ್ಲಿ ಹುಟ್ಟುತ್ತದೆ.

<aside class="notes"><h5 id="kāvēri-nadi-talakāvēriyalli-huṭṭuttade">Kāvēri nadi talakāvēriyalli huṭṭuttade.</h5>
<p>The Kaveri river originates in Talakaveri.</p>
<ul>
<li><strong>ಕಾವೇರಿ (kāvēri)</strong> – Kaveri</li>
<li><strong>ನದಿ (nadi)</strong> – River</li>
<li><strong>ತಲಕಾವೇರಿಯಲ್ಲಿ (talakāvēriyalli)</strong> – In Talakaveri</li>
<li><strong>ಹುಟ್ಟುತ್ತದೆ (huṭṭuttade)</strong> – Is born / Originates</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಸ್ವಂತ ವಾಕ್ಯಗಳು

### ೮. ಅಣೆಕಟ್ಟು

Dam

<aside class="notes"><p>anekattu</p>
</aside></script></section><section data-markdown><script type="text/template">
<!-- .slide: data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

೮. ಅಣೆಕಟ್ಟು

### ಕೆ.ಆರ್.ಎಸ್ ಅಣೆಕಟ್ಟು ಮೈಸೂರಿನಲ್ಲಿದೆ.

<aside class="notes"><h5 id="keāres-aṇekaṭṭu-maisūrinallide">Ke.Ār.Es aṇekaṭṭu maisūrinallide.</h5>
<p>The K.R.S. dam is in Mysuru.</p>
<ul>
<li><strong>ಅಣೆಕಟ್ಟು (aṇekaṭṭu)</strong> – Dam</li>
<li><strong>ಮೈಸೂರಿನಲ್ಲಿದೆ (maisūrinallide)</strong> – Is in Mysuru</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಸ್ವಂತ ವಾಕ್ಯಗಳು

### ೯. ಬೆಟ್ಟ

Hill

<aside class="notes"><p>betta</p>
</aside></script></section><section data-markdown><script type="text/template">
<!-- .slide: data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

೯. ಬೆಟ್ಟ

### ಮಧುಗಿರಿಯಲ್ಲಿ ಏಕಶಿಲಾ ಬೆಟ್ಟವಿದೆ.

<aside class="notes"><h5 id="madhugiriyalli-ēkaśilā-beṭṭavide">Madhugiriyalli ēkaśilā beṭṭavide.</h5>
<p>There is a monolith hill in Madhugiri.</p>
<ul>
<li><strong>ಮಧುಗಿರಿಯಲ್ಲಿ (madhugiriyalli)</strong> – In Madhugiri</li>
<li><strong>ಏಕಶಿಲಾ (ēkaśilā)</strong> – Monolith / Single stone</li>
<li><strong>ಬೆಟ್ಟವಿದೆ (beṭṭavide)</strong> – There is a hill</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಸ್ವಂತ ವಾಕ್ಯಗಳು

### ೧೦. ಮುಖ್ಯ

Main / Important

<aside class="notes"><p>mukhya</p>
</aside></script></section><section data-markdown><script type="text/template">
<!-- .slide: data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

೧೦. ಮುಖ್ಯ

### ಕಾವೇರಿ ನದಿ ಕನ್ನಡ ನಾಡಿನ ಮುಖ್ಯ ನದಿ.

<aside class="notes"><h5 id="kāvēri-nadi-kannaḍa-nāḍina-mukhya-nadi">Kāvēri nadi kannaḍa nāḍina mukhya nadi.</h5>
<p>Kaveri river is the main river of the land of Kannada.</p>
<ul>
<li><strong>ಕನ್ನಡ ನಾಡಿನ (kannaḍa nāḍina)</strong> – Of the Kannada land</li>
<li><strong>ಮುಖ್ಯ (mukhya)</strong> – Main / Important</li>
<li><strong>ನದಿ (nadi)</strong> – River</li>
</ul>
</aside></script></section></section><section ><section data-markdown><script type="text/template">

### ೧. ಕನ್ನಡ ನಾಡಿನ ಜೀವನದಿ ಯಾವುದು ?

###### Kannaḍa nāḍina jīvanadi yāvudu?

</ul>

೧. ಕನ್ನಡ ನಾಡಿನ ಜೀವನದಿ ಯಾವುದು ?

### ಕನ್ನಡ ನಾಡಿನ ಜೀವನದಿ <u>ಕಾವೇರಿ</u><!-- .element class="fragment highlight-blue" -->.

<aside class="notes"><h5 id="kannaḍa-nāḍina-jīvanadi-yāvudu">Kannaḍa nāḍina jīvanadi yāvudu?</h5>
<p>Which is the life-river of Karnataka?</p>
<h5 id="kannaḍa-nāḍina-jīvanadi-kāvēri">Kannaḍa nāḍina jīvanadi kāvēri.</h5>
<p>Kaveri is the life-river of Karnataka.</p>
<ul>
<li>ಕನ್ನಡ ನಾಡಿನ (kannaḍa nāḍina) – of Kannada land/Karnataka</li>
<li>ಜೀವನದಿ (jīvanadi) – life-river (lifeline)</li>
<li>ಕಾವೇರಿ (kāvēri) – Kaveri (river name)</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸಿರಿ

### ೨. ಕಾವೇರಿ ನದಿ ಎಲ್ಲಿ ಹುಟ್ಟುತ್ತದೆ ?

###### Kāvēri nadi elli huṭṭuttade?

<aside class="notes"><h4 id="where-does-the-kaveri-river-originate">Where does the Kaveri river originate?</h4>
<ul>
<li>ಕಾವೇರಿ (kāvēri) – Kaveri</li>
<li>ನದಿ (nadi) – river</li>
<li>ಎಲ್ಲಿ (elli) – where</li>
<li>ಹುಟ್ಟುತ್ತದೆ (huṭṭuttade) – is born / originates</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">
<!-- .slide: data-auto-animate data-transition="slide" data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

೨. ಕಾವೇರಿ ನದಿ ಎಲ್ಲಿ ಹುಟ್ಟುತ್ತದೆ ?

### ಕಾವೇರಿ ನದಿ <u>ತಲಕಾವೇರಿಯಲ್ಲಿ ಹುಟ್ಟುತ್ತದೆ.</u><!-- .element class="fragment highlight-blue" -->

<aside class="notes"><h5 id="kāvēri-nadi-elli-huṭṭuttade">Kāvēri nadi elli huṭṭuttade?</h5>
<p>Where does the Kaveri river originate?</p>
<h5 id="kāvēri-nadi-talakāvēriyalli-huṭṭuttade">Kāvēri nadi talakāvēriyalli huṭṭuttade.</h5>
<p>The Kaveri river originates in Talakaveri.</p>
<ul>
<li>ಕಾವೇರಿ ನದಿ (kāvēri nadi) – Kaveri river</li>
<li>ತಲಕಾವೇರಿಯಲ್ಲಿ (talakāvēriyalli) – in Talakaveri</li>
<li>ಹುಟ್ಟುತ್ತದೆ (huṭṭuttade) – originates</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸಿರಿ

### ೩. ಕಾವೇರಿ ನದಿಯ ದೊಡ್ಡ ಆಣೆಕಟ್ಟಿನ ಹೆಸರೇನು ?

###### Kāvēri nadiya doḍḍa āṇekaṭṭina hesarēnu?

<aside class="notes"><h4 id="what-is-the-name-of-the-big-dam-across-the-kaveri-river">What is the name of the big dam across the Kaveri river?</h4>
<ul>
<li>ನದಿಯ (nadiya) – of the river</li>
<li>ದೊಡ್ಡ (doḍḍa) – big</li>
<li>ಆಣೆಕಟ್ಟಿನ (āṇekaṭṭina) – of the dam</li>
<li>ಹೆಸರೇನು (hesarēnu) – what is the name</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

### ಕಾವೇರಿ ನದಿಯ ದೊಡ್ಡ ಆಣೆಕಟ್ಟಿನ ಹೆಸರು <u>ಕೃಷ್ಣರಾಜಸಾಗರ (ಕೆ.ಆರ್.ಎಸ್)</u><!-- .element class="fragment highlight-blue" -->.

<aside class="notes"><h5 id="kāvēri-nadiya-doḍḍa-āṇekaṭṭina-hesarēnu">Kāvēri nadiya doḍḍa āṇekaṭṭina hesarēnu?</h5>
<p>What is the name of the big dam across the Kaveri river?</p>
<h5 id="kāvēri-nadiya-doḍḍa-āṇekaṭṭina-hesaru-kṛṣṇarājasāgara">Kāvēri nadiya doḍḍa āṇekaṭṭina hesaru Kṛṣṇarājasāgara.</h5>
<p>The name of the big dam across the Kaveri river is Krishna Raja Sagara (K.R.S).</p>
<ul>
<li>ದೊಡ್ಡ (doḍḍa) – big</li>
<li>ಆಣೆಕಟ್ಟಿನ (āṇekaṭṭina) – of the dam</li>
<li>ಹೆಸರು (hesaru) – name</li>
<li>ಕೃಷ್ಣರಾಜಸಾಗರ (kṛṣṇarājasāgara) – Krishna Raja Sagara</li>

೪. ಏಷ್ಯಾ ಖಂಡದ ಪ್ರಥಮ ವಿದ್ಯುತ್ ಉತ್ಪಾದನಾ ಕೇಂದ್ರ ಯಾವುದು ?

### ಏಷ್ಯಾ ಖಂಡದ ಪ್ರಥಮ ವಿದ್ಯುತ್ ಉತ್ಪಾದನಾ ಕೇಂದ್ರ <u>ಶಿವನಸಮುದ್ರ</u><!-- .element class="fragment highlight-blue" -->.

<p>Which is the first power generating station in the continent of Asia?</p>
<h5 id="ēṣyā-khaṇḍada-prathama-vidyut-utpādanā-kēndra-śivanasamudra">ēṣyā khaṇḍada prathama vidyut utpādanā kēndra śivanasamudra.</h5>
<p>The first power generating station in Asia is Shivanasamudra.</p>
<ul>
<li>ಪ್ರಥಮ (prathama) – first</li>
<li>ವಿದ್ಯುತ್ (vidyut) – electricity</li>
<li>ಉತ್ಪಾದನಾ ಕೇಂದ್ರ (utpādanā kēndra) – production center</li>

### ೫. ಕಾವೇರಿ ನದಿ ಹರಿದು ಕೊನೆಗೆ ಎಲ್ಲಿಗೆ ಸೇರುತ್ತದೆ ?

###### Kāvēri nadi haridu konege ellige sēruttade?

<aside class="notes"><h4 id="where-does-the-kaveri-river-eventually-flow-and-join">Where does the Kaveri river eventually flow and join?</h4>
<ul>
<li>ಹರಿದು (haridu) – having flowed</li>
<li>ಕೊನೆಗೆ (konege) – at the end / finally</li>
<li>ಎಲ್ಲಿಗೆ (ellige) – to where</li>
<li>ಸೇರುತ್ತದೆ (sēruttade) – joins / reaches</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

೫. ಕಾವೇರಿ ನದಿ ಹರಿದು ಕೊನೆಗೆ ಎಲ್ಲಿಗೆ ಸೇರುತ್ತದೆ ?

### ಕಾವೇರಿ ನದಿ ಹರಿದು ಕೊನೆಗೆ <u>ಬೆಂಗಾಳಕೊಲ್ಲಿಯನ್ನು ಸೇರುತ್ತದೆ.</u><!-- .element class="fragment highlight-blue" -->

<aside class="notes"><h5 id="kāvēri-nadi-haridu-konege-ellige-sēruttade">Kāvēri nadi haridu konege ellige sēruttade?</h5>

<h5 id="kāvēri-nadi-haridu-konege-bengāḷakolliyannu-sēruttade">Kāvēri nadi haridu konege bengāḷakolliyannu sēruttade.</h5>
<p>The Kaveri river flows and finally joins the Bay of Bengal.</p>

### ೧. ಕಡಲಿನ ತೀರದ ದೃಶ್ಯ ನೋಡಲಿಕೆ ಹೇಗೆ ಕಾಣುತ್ತದೆ?

೧. ಕಡಲಿನ ತೀರದ ದೃಶ್ಯ ನೋಡಲಿಕೆ ಹೇಗೆ ಕಾಣುತ್ತದೆ?

### ಕಡಲಿನ ತೀರದ ದೃಶ್ಯ ನೋಡಲಿಕೆ <u>ಸುಂದರವಾಗಿ</u><!-- .element class="fragment highlight-blue" --> ಕಾಣುತ್ತದೆ.

<aside class="notes"><h5 id="kaḍalina-tīrada-dṛśya-nōḍalike-hēge-kāṇuttade">Kaḍalina tīrada dṛśya nōḍalike hēge kāṇuttade?</h5>
<p>How does the scene of the sea shore look?</p>
<h5 id="kaḍalina-tīrada-dṛśya-nōḍalike-sundaravāgi-kāṇuttade">Kaḍalina tīrada dṛśya nōḍalike sundaravāgi kāṇuttade.</h5>
<p>The scene of the sea shore looks beautiful.</p>
<ul>
<li>ಸುಂದರವಾಗಿ (sundaravāgi) – beautifully</li>
<li>ಕಾಣುತ್ತದೆ (kāṇuttade) – appears / looks</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

### ೨. ಕಡಲಿನ ತೀರದಲ್ಲಿ ಯಾವುದು ರಾಶಿ ರಾಶಿ ಹರಡಿರುತ್ತದೆ?

###### Kaḍalina tīradalli yāvudu rāśi rāśi haraḍiruttade?

<aside class="notes"><h4 id="what-is-spread-out-in-heapspiles-on-the-sea-shore">What is spread out in heaps/piles on the sea shore?</h4>
<ul>
<li>ಕಡಲಿನ ತೀರದಲ್ಲಿ (kaḍalina tīradalli) – on the sea shore</li>
<li>ಯಾವುದು (yāvudu) – which / what</li>
<li>ರಾಶಿ ರಾಶಿ (rāśi rāśi) – heaps and heaps / piles</li>
<li>ಹರಡಿರುತ್ತದೆ (haraḍiruttade) – is spread out</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">
<!-- .slide: data-auto-animate data-transition="slide" data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

೨. ಕಡಲಿನ ತೀರದಲ್ಲಿ ಯಾವುದು ರಾಶಿ ರಾಶಿ ಹರಡಿರುತ್ತದೆ?

### ಕಡಲಿನ ತೀರದಲ್ಲಿ <u>ಕಪ್ಪೆಯ ಚಿಪ್ಪಿನ</u><!-- .element class="fragment highlight-blue" --> ರಾಶಿ ಹರಡಿರುತ್ತದೆ.

<aside class="notes"><h5 id="kaḍalina-tīradalli-yāvudu-rāśi-rāśi-haraḍiruttade">Kaḍalina tīradalli yāvudu rāśi rāśi haraḍiruttade?</h5>

<h5 id="kaḍalina-tīradalli-kappeya-cippina-rāśi-haraḍiruttade">Kaḍalina tīradalli kappeya cippina rāśi haraḍiruttade.</h5>
<p>Heaps of sea shells are spread out on the sea shore.</p>

### ೩. ಕಡಲಿನಾಳದಲಿ ಯಾವ ಗಣಿ ಇದೆ?

###### Kaḍalināḷadali yāva gaṇi ide?

<aside class="notes"><h4 id="which-mine-is-there-in-the-depths-of-the-sea">Which mine is there in the depths of the sea?</h4>
<ul>
<li>ಕಡಲಿನಾಳದಲಿ (kaḍalināḷadali) – in the depths of the sea</li>
<li>ಯಾವ (yāva) – which</li>
<li>ಗಣಿ (gaṇi) – mine</li>
<li>ಇದೆ (ide) – is there / exists</li>
</ul>

<aside class="notes"><h5 id="kaḍalināḷadali-yāva-gaṇi-ide">Kaḍalināḷadali yāva gaṇi ide?</h5>

<h5 id="kaḍalināḷadali-ratnada-gaṇi-ide">Kaḍalināḷadali ratnada gaṇi ide.</h5>
<p>There is a mine of gems in the depths of the sea.</p>
