<aside class="notes"><h3 id="ondu-vākyadalli-uttarisiri">Ondu vākyadalli uttarisiri</h3>

###### ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸಿರಿ
### ೧. ಗುರುಗಳು ಎಲ್ಲಿಗೆ ಬಂದರು ?
###### Gurugaḷu ellige bandaru?

<aside class="notes"><h4 id="where-did-the-teacher-come">Where did the teacher come?</h4>
<ul>
<li>ಗುರುಗಳು (gurugaḷu) – teacher    </li>
<li>ಎಲ್ಲಿಗೆ (ellige) – where to</li>
<li>ಬಂದರು (bandaru) – came</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">
<!-- .slide: data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

೧. ಗುರುಗಳು ಎಲ್ಲಿಗೆ ಬಂದರು ?

### ಗುರುಗಳು <u>ತರಗತಿಗೆ</u><!-- .element class="fragment highlight-blue" -->  ಬಂದರು .

<aside class="notes"><h5 id="gurugaḷu-ellige-bandaru">Gurugaḷu ellige bandaru?</h5>
<p>Where did the teacher come?</p>
<h5 id="gurugaḷu-taragatige-bandaru">Gurugaḷu taragatige bandaru.</h5>
<p>The teacher came to the classroom.</p>
<ul>
<li>ಗುರುಗಳು (gurugaḷu) – teacher</li>
<li>ತರಗತಿಗೆ (taragatige) – to the classroom</li>
<li>ಬಂದರು (bandaru) – came</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸಿರಿ
### ೨. ಒಬ್ಬ ಬಾಲಕ ಎದ್ದು ನಿಂತು ಗುರುಗಳಿಗೆ ಏನೆಂದು ಹೇಳಿದನು ?
###### Obba bālaka eddhu nintu gurugaḷige ēnendu hēḷidanu?

<aside class="notes"><h4 id="what-did-the-boy-stand-up-and-say-to-the-teacher">What did the boy stand up and say to the teacher?</h4>
<ul>
<li>ಒಬ್ಬ ಬಾಲಕ (obba bālaka) – a boy</li>
<li>ಎದ್ದು ನಿಂತು (eddhu nintu) – stood up</li>
<li>ಗುರುಗಳಿಗೆ (gurugaḷige) – to the teacher</li>
<li>ಏನೆಂದು (ēnendu) – what</li>
<li>ಹೇಳಿದನು (hēḷidanu) – said</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">
<!-- .slide: data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

೨. ಒಬ್ಬ ಬಾಲಕ ಎದ್ದು ನಿಂತು ಗುರುಗಳಿಗೆ ಏನೆಂದು ಹೇಳಿದನು ?
### ಒಬ್ಬ ಬಾಲಕ ಎದ್ದು ನಿಂತು <u>"ಗುರುಗಳೇ, ನಾನು ಲೆಕ್ಕಗಳನ್ನು ಮಾಡಿ ತಂದಿದ್ದೇನೆ" ಎಂದು</u><!-- .element class="fragment highlight-blue" --> ಹೇಳಿದನು.

<aside class="notes"><h5 id="obba-bālaka-eddhu-nintu-gurugaḷige-ēnendu-hēḷidanu">Obba bālaka eddhu nintu gurugaḷige ēnendu hēḷidanu?</h5>
<p>What did the boy stand up and say to the teacher?</p>
<h5 id="obba-bālaka-eddhu-nintu-gurugaḷe-nānu-lekkagaḷannu-māḍi-tandiddene-endu-hēḷidanu">Obba bālaka eddhu nintu &quot;Gurugaḷe, nānu lekkagaḷannu māḍi tandiddene&quot; endu hēḷidanu.</h5>
<p>A boy stood up and said, “Teacher, I have done the sums and brought them.”</p>
<ul>
<li>ಒಬ್ಬ ಬಾಲಕ (obba bālaka) – a boy</li>
<li>ಗುರುಗಳೇ (gurugaḷe) – O teacher</li>
<li>ನಾನು (nānu) – I</li>
<li>ಲೆಕ್ಕಗಳನ್ನು (lekkagaḷannu) – sums / calculations</li>
<li>ಮಾಡಿ ತಂದಿದ್ದೇನೆ (māḍi tandiddene) – have done and brought</li>
<li>ಎಂದು ಹೇಳಿದನು (endu hēḷidanu) – said</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸಿರಿ
### ೩. ಗುರುಗಳು ಬಾಲಕನಿಗೆ ಯಾವ ಸಾಲಿನಲ್ಲಿ ಕುಳಿತುಕೊಳ್ಳಲು ಹೇಳಿದರು ?
###### Gurugaḷu bālakannage yāva sālinalli kuḷitukoḷḷalu hēḷidaru?

<aside class="notes"><h4 id="in-which-row-did-the-teacher-ask-the-boy-to-sit">In which row did the teacher ask the boy to sit?</h4>
<ul>
<li>ಗುರುಗಳು (gurugaḷu) – teacher</li>
<li>ಬಾಲಕನಿಗೆ (bālakannage) – to the boy</li>
<li>ಯಾವ ಸಾಲಿನಲ್ಲಿ (yāva sālinalli) – in which row</li>
<li>ಕುಳಿತುಕೊಳ್ಳಲು (kuḷitukoḷḷalu) – to sit</li>
<li>ಹೇಳಿದರು (hēḷidaru) – said / told</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">
<!-- .slide: data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

೩. ಗುರುಗಳು ಬಾಲಕನಿಗೆ ಯಾವ ಸಾಲಿನಲ್ಲಿ ಕುಳಿತುಕೊಳ್ಳಲು ಹೇಳಿದರು ?
### ಗುರುಗಳು ಬಾಲಕನಿಗೆ <u>ಮುಂದಿನ</u><!-- .element class="fragment highlight-blue" --> ಸಾಲಿನಲ್ಲಿ ಕುಳಿತುಕೊಳ್ಳಲು ಹೇಳಿದರು.

<aside class="notes"><h5 id="gurugaḷu-bālakannage-yāva-sālinalli-kuḷitukoḷḷalu-hēḷidaru">Gurugaḷu bālakannage yāva sālinalli kuḷitukoḷḷalu hēḷidaru?</h5>
<p>In which row did the teacher ask the boy to sit?</p>
<h5 id="gurugaḷu-bālakannage-mundina-sālinalli-kuḷitukoḷḷalu-hēḷidaru">Gurugaḷu bālakannage mundina sālinalli kuḷitukoḷḷalu hēḷidaru.</h5>
<p>The teacher told the boy to sit in the front row.</p>
<ul>
<li>ಗುರುಗಳು (gurugaḷು) – teacher</li>
<li>ಬಾಲಕನಿಗೆ (bālakannage) – to the boy</li>
<li>ಮುಂದಿನ ಸಾಲಿನಲ್ಲಿ (mundina sālinalli) – in the front row</li>

<li>ಹೇಳಿದರು (hēḷidaru) – said / told</li>

### ೪. ಬಾಲಕನಿಗೆ ಏನು ಹೇಳಲು ಮನಸ್ಸು ಬರಲಿಲ್ಲ ?
###### Bālakannage ēnu hēḷalu manassu baralilla?

<aside class="notes"><h4 id="what-did-the-boy-not-feel-like-saying">What did the boy not feel like saying?</h4>
<ul>
<li>ಬಾಲಕನಿಗೆ (bālakannage) – to the boy</li>
<li>ಏನು (ēnu) – what</li>
<li>ಹೇಳಲು (hēḷalu) – to say</li>
<li>ಮನಸ್ಸು ಬರಲಿಲ್ಲ (manassu baralilla) – did not feel like / didn’t want to</li>

<!-- .slide: data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

೪. ಬಾಲಕನಿಗೆ ಏನು ಹೇಳಲು ಮನಸ್ಸು ಬರಲಿಲ್ಲ ?
### ಬಾಲಕನಿಗೆ <u>ಸುಳ್ಳು</u><!-- .element class="fragment highlight-blue" --> ಹೇಳಲು ಮನಸ್ಸು ಬರಲಿಲ್ಲ.

<aside class="notes"><h5 id="bālakannage-ēnu-hēḷalu-manassu-baralilla">Bālakannage ēnu hēḷalu manassu baralilla?</h5>
<p>What did the boy not feel like saying?</p>
<h5 id="bālakannage-suḷḷu-hēḷalu-manassu-baralilla">Bālakannage suḷḷu hēḷalu manassu baralilla.</h5>
<p>The boy did not feel like telling a lie.</p>
<ul>
<li>ಬಾಲಕನಿಗೆ (bālakannage) – to the boy</li>
<li>ಸುಳ್ಳು (suḷḷu) – lie</li>
<li>ಹೇಳಲು (hēḷalu) – to say</li>
<li>ಮನಸ್ಸು ಬರಲಿಲ್ಲ (manassu baralilla) – did not feel like</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸಿರಿ
### ೫. ಗುರುಗಳಿಗೆ ಅಚ್ಚರಿ ಮತ್ತು ಆನಂದ ಏಕಾಯಿತು ?
###### Gurugaḷige accari mattu ānanda ēkāyitu?

<aside class="notes"><h4 id="why-did-the-teacher-feel-surprise-and-joy">Why did the teacher feel surprise and joy?</h4>
<ul>
<li>ಗುರುಗಳಿಗೆ (gurugaḷige) – to the teacher</li>
<li>ಅಚ್ಚರಿ (accari) – surprise</li>
<li>ಮತ್ತು (mattu) – and</li>
<li>ಆನಂದ (ānanda) – joy</li>
<li>ಏಕಾಯಿತು (ēkāyitu) – why happened / why did it happen</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">
<!-- .slide: data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

೫. ಗುರುಗಳಿಗೆ ಅಚ್ಚರಿ ಮತ್ತು ಆನಂದ ಏಕಾಯಿತು ?
### ಗುರುಗಳಿಗೆ ಬಾಲಕನ ಪ್ರಾಮಾಣಿಕತೆಯನ್ನು ಕಂಡು ಅಚ್ಚರಿ ಮತ್ತು ಆನಂದವಾಯಿತು.

<aside class="notes"><h5 id="gurugaḷige-accari-mattu-ānanda-ēkāyitu">Gurugaḷige accari mattu ānanda ēkāyitu?</h5>
<p>Why did the teacher feel surprise and joy?</p>
<h5 id="gurugaḷige-bālakan-prāmāṇikatayannu-kaṇḍu-accari-mattu-ānanda-vāyitu">Gurugaḷige bālakan prāmāṇikatayannu kaṇḍu accari mattu ānanda vāyitu.</h5>
<p>The teacher felt surprise and joy on seeing the boy’s honesty.</p>
<ul>
<li>ಗುರುಗಳಿಗೆ (gurugaḷige) – to the teacher</li>
<li>ಬಾಲಕನ (bālakan) – the boy’s</li>
<li>ಪ್ರಾಮಾಣಿಕತೆ (prāmāṇikate) – honesty</li>
<li>ಕಂಡು (kaṇḍu) – on seeing</li>
<li>ಅಚ್ಚರಿ (accari) – surprise</li>
<li>ಆನಂದವಾಯಿತು (ānandavāyitu) – felt joy</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

<aside class="notes"><h5 id="satyavanta-bālakan-hesarēnu">Satyavanta bālakan hesarēnu?</h5>

<h5 id="satyavanta-bālakan-hesaru-gōpālakṛṣṇa-gōkhale">Satyavanta bālakan hesaru Gōpālakṛṣṇa Gōkhale.</h5>
<p>The truthful boy’s name is Gopalakrishna Gokhale.</p>
<ul>
<li>ಸತ್ಯವಂತ (satyavanta) – truthful</li>
<li>ಬಾಲಕನ (bālakan) – the boy’s</li>
<li>ಹೆಸರು (hesaru) – name</li>
<li>ಗೋಪಾಲಕೃಷ್ಣ ಗೋಖಲೆ (Gōpālakṛṣṇa Gōkhale) – Gopalakrishna Gokhale</li>

### ೧. ಮಂಗಗಳು ಎಲ್ಲಿ ವಾಸಿಸುತ್ತಿದ್ದವು ?
###### Mangagaḷu elli vāsiṣuttiddavu?

<ul>
<li>ಮಂಗಗಳು (mangagaḷu) – monkeys</li>

೧. ಮಂಗಗಳು ಎಲ್ಲಿ ವಾಸಿಸುತ್ತಿದ್ದವು ?
### ಮಂಗಗಳು <u>ಕಾಡಿನಲ್ಲಿ </u><!-- .element class="fragment highlight-blue" --> ವಾಸಿಸುತ್ತಿದ್ದವು.

<aside class="notes"><h5 id="mangagaḷu-elli-vāsiṣuttiddavu">Mangagaḷu elli vāsiṣuttiddavu?</h5>
<p>Where did the monkeys live?</p>
<h5 id="mangagaḷu-kāḍinalli-vāsiṣuttiddavu">Mangagaḷu kāḍinalli vāsiṣuttiddavu.</h5>
<p>The monkeys lived in the forest.</p>
<ul>
<li>ಮಂಗಗಳು (mangagaḷu) – monkeys</li>
<li>ಕಾಡಿನಲ್ಲಿ (kāḍinalli) – in the forest</li>
<li>ವಾಸಿಸುತ್ತಿದ್ದವು (vāsiṣuttiddavu) – were living</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">
<!-- .slide: data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

೧. ಮಂಗಗಳು ಎಲ್ಲಿ ವಾಸಿಸುತ್ತಿದ್ದವು?
### ಮಂಗಗಳು <u>ಬಾಳೆಯ ತೋಟದ ಪಕ್ಕದ ಕಾಡಿನಲ್ಲಿ</u><!-- .element class="fragment highlight-blue" --> ವಾಸಿಸುತ್ತಿದ್ದವು.

<aside class="notes"><h5 id="mangagaḷu-elli-vāsisuttiddavu">Mangagaḷu elli vāsisuttiddavu?</h5>
<p>Where were the monkeys living?</p>
<h5 id="mangagaḷu-bāḷeya-tōṭada-pakkada-kāḍinalli-vāsisuttiddavu">Mangagaḷu bāḷeya tōṭada pakkada kāḍinalli vāsisuttiddavu.</h5>
<p>The monkeys were living in the forest next to the banana plantation.</p>
<ul>
<li>ಮಂಗಗಳು (mangagaḷu) – monkeys</li>
<li>ಬಾಳೆಯ ತೋಟದ (bāḷeya tōṭada) – banana garden/plantation</li>
<li>ಪಕ್ಕದ (pakkada) – beside / next to</li>
<li>ಕಾಡಿನಲ್ಲಿ (kāḍinalli) – in the forest</li>
<li>ವಾಸಿಸುತ್ತಿದ್ದವು (vāsisuttiddavu) – were living</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

### ೨. ಮಂಗಗಳು ಯಾವ ತೋಟಕ್ಕೆ ಹರಿದವು ?
###### Mangagaḷu yāva tōṭakke haridavu?

<aside class="notes"><h4 id="to-which-garden-did-the-monkeys-rush">To which garden did the monkeys rush?</h4>
<ul>
<li>ಮಂಗಗಳು (mangagaḷu) – monkeys</li>
<li>ಯಾವ (yāva) – which</li>
<li>ತೋಟಕ್ಕೆ (tōṭakke) – to the garden</li>
<li>ಹರಿದವು (haridavu) – rushed</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">
<!-- .slide: data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

೨. ಮಂಗಗಳು ಯಾವ ತೋಟಕ್ಕೆ ಹರಿದವು ?
### ಮಂಗಗಳು <u>ಬಾಳೆಯ</u><!-- .element class="fragment highlight-blue" -->  ತೋಟಕ್ಕೆ  ಹರಿದವು.

<aside class="notes"><h5 id="mangagaḷu-yāva-tōṭakke-haridavu">Mangagaḷu yāva tōṭakke haridavu?</h5>
<p>To which garden did the monkeys rush?</p>

<p>The monkeys rushed to the banana garden.</p>
<ul>
<li>ಮಂಗಗಳು (mangagaḷu) – monkeys</li>
<li>ಬಾಳೆಯ (bāḷeya) – banana</li>
<li>ತೋಟಕ್ಕೆ (tōṭakke) – to the garden</li>
<li>ಹರಿದವು (haridavu) – rushed</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

###### ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸಿರಿ
### ೩. ಮಂಗಗಳು ಸುಲಿದ ಬಾಳೆಯ ಹಣ್ಣನ್ನು ಎಲ್ಲಿ ಇಟ್ಟುಕೊಂಡವು ?
###### Mangagaḷu sulida bāḷeya haṇṇannu elli iṭṭukoṇḍavu?

<aside class="notes"><h4 id="where-did-the-monkeys-keep-the-peeled-banana">Where did the monkeys keep the peeled banana?</h4>
<ul>
<li>ಮಂಗಗಳು (mangagaḷu) – monkeys</li>
<li>ಸುಲಿದ (sulida) – peeled</li>
<li>ಬಾಳೆಯ ಹಣ್ಣು (bāḷeya haṇṇu) – banana</li>
<li>ಎಲ್ಲಿ (elli) – where</li>
<li>ಇಟ್ಟುಕೊಂಡವು (iṭṭukoṇḍavu) – kept</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">
<!-- .slide: data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

೩. ಮಂಗಗಳು ಸುಲಿದ ಬಾಳೆಯ ಹಣ್ಣನ್ನು ಎಲ್ಲಿ ಇಟ್ಟುಕೊಂಡವು ?
### ಮಂಗಗಳು ಸುಲಿದ ಬಾಳೆಯ ಹಣ್ಣನ್ನು <u>ಕೈಯಲ್ಲಿ </u><!-- .element class="fragment highlight-blue" --> ಇಟ್ಟುಕೊಂಡವು.

<aside class="notes"><h5 id="mangagaḷu-sulida-bāḷeya-haṇṇannu-elli-iṭṭukoṇḍavu">Mangagaḷu sulida bāḷeya haṇṇannu elli iṭṭukoṇḍavu?</h5>
<p>Where did the monkeys keep the peeled banana?</p>
<h5 id="mangagaḷu-sulida-bāḷeya-haṇṇannu-kaiyalli-iṭṭukoṇḍavu">Mangagaḷu sulida bāḷeya haṇṇannu kaiyalli iṭṭukoṇḍavu.</h5>
<p>The monkeys kept the peeeled banana in their hand.</p>
<ul>
<li><p>ಮಂಗಗಳು (mangagaḷu) – monkeys</p>
</li>
<li><p>ಸುಲಿದ (sulida) – peeled</p>
</li>
<li><p>ಬಾಳೆಯ ಹಣ್ಣು (bāḷeya haṇṇu) – banana</p>
</li>
<li><p>ಕೈಯಲ್ಲಿ (kaiyalli) – in the hand</p>
</li>
<li><p>ಕೈಯೊಳಗೆ (kaiyolage) - inside the hand</p>
</li>
<li><p>ಇಟ್ಟುಕೊಂಡವು (iṭṭukoṇḍavu) – kept</p>
</li>
<li><p>ಮಂಗಗಳು ಸುಲಿದ ಬಾಳೆಯ ಹಣ್ಣನ್ನು ಕೈಯಲ್ಲಿ ಇಟ್ಟುಕೊಂಡವು.<br>  This is more general: “They kept the peeled banana fruit in their hand.”<br>  It emphasizes possession, like holding it in the hand.</p>
</li>
<li><p>ಮಂಗಗಳು ಸುಲಿದ ಬಾಳೆಯ ಹಣ್ಣನ್ನು ಕೈಯೊಳಗೆ ಇಟ್ಟುಕೊಂಡವು.<br>  This is more specific: “They kept the peeled banana fruit inside their hand (palm).”<br>  It suggests the fruit is enclosed or hidden within the hand.</p>
</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

<p>What did the baby monkey say?</p>

##### ಬಿಟ್ಟಸ್ಥಳವನ್ನು ತುಂಬಿರಿ

### ೨. ಏನೂ ತಿನ್ನದೆ <u>ಮಟ ಮಟ</u><!-- .element class="fragment highlight-blue" --> ನೋಡುತ ಇದ್ದವು ಮರದಲ್ಲಿ.

_maṭa maṭa_ / **staring / wide-eyed**

<aside class="notes"><h4 id="ēnū-tinnade-maṭa-maṭa-nōḍuta-iddavu-maradalli">Ēnū tinnade maṭa maṭa nōḍuta iddavu maradalli</h4>
<p>Without eating anything, they were staring wide-eyed on the tree.</p>
<ul>
<li>ಏನೂ (ēnū) – anything</li>
<li>ತಿನ್ನದೆ (tinnade) – without eating</li>
<li><em>ಮಟ ಮಟ</em> (maṭa maṭa) – <strong>staring / wide-eyed</strong></li>
<li>ನೋಡುತ (nōḍuta) – looking / watching</li>
<li>ಮರದಲ್ಲಿ (maradalli) – on the tree</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">

##### ಬಿಟ್ಟಸ್ಥಳವನ್ನು ತುಂಬಿರಿ

### ೩. "ಕೈಯಲ್ಲೇತಕೆ ______ ಆಗದೆ" ಎಂದಿತು ಇನ್ನೊಂದು.

<aside class="notes"><h4 id="kaiyallētake-______-āgadē-enditu-innondu">&quot;Kaiyallētake ______ āgadē&quot; enditu innondu</h4>
</aside></script></section><section data-markdown><script type="text/template">

<!-- .slide: data-background-gradient="linear-gradient(to right, #F9A8D4, #D8B4FE, #818CF8)" -->

##### ಬಿಟ್ಟಸ್ಥಳವನ್ನು ತುಂಬಿರಿ

### ೩. "ಕೈಯಲ್ಲೇತಕೆ <u>ಬಾಯೊಳಗಿಟ್ಟರೆ</u><!-- .element class="fragment highlight-blue" --> ಆಗದೆ" ಎಂದಿತು ಇನ್ನೊಂದು.

_bāyoḷagiṭṭare_ / **if (you) put it in the mouth**

<aside class="notes"><h4 id="kaiyallētake-bāyoḷagiṭṭare-āgadē-enditu-innondu">&quot;Kaiyallētake bāyoḷagiṭṭare āgadē&quot; enditu innondu</h4>
<p>&quot;Why keep it in the hand? If you put it in the mouth, it won’t be a problem,&quot; said another.</p>
<ul>
<li>ಕೈಯಲ್ಲೇತಕೆ (kaiyallētake) – why (keep it) in the hand</li>
<li><em>ಬಾಯೊಳಗಿಟ್ಟರೆ</em> (bāyoḷagiṭṭare) – <strong>if (you) put it in the mouth</strong></li>
<li>ಆಗದೆ (āgadē) – won’t it work / won’t it be possible</li>
<li>ಎಂದಿತು (enditu) – said</li>
<li>ಇನ್ನೊಂದು (innondu) – another</li>
</ul>
</aside></script></section></section><section ><section data-markdown><script type="text/template">

## ಹೊಂದಿಸಿ ಬರೆಯಿರಿ

༻༺

#### Match the following

<aside class="notes"><h4 id="hondisi-bareyiri">Hondisi bareyiri</h4>
</aside></script></section><section data-markdown><script type="text/template">

### ಹೊಂದಿಸಿ ಬರೆಯಿರಿ

1. ಒಂದುಪವಾಸವ - ಮಾಡಿದವು
2. ನಾಳೆಗೆ ತಿಂಡಿಯ  - ಈಗಲೆ ಹುಡುಕುವ 
3. ಆಸೆಯು ಹೆಚ್ಚಿತು - ನೀರೂರಿ 
4. ಹೌದೌದೆನ್ನುತ  - ಹಣ್ಣನು ಸುಲಿದವು

<aside class="notes"><ul>
<li><strong>ಒಂದುಪವಾಸವ</strong> (ondupavāsava) – one fasting</li>
<li><strong>ಮಾಡಿದವು</strong> (mādidavu) – did</li>
<li><strong>ನಾಳೆಗೆ ತಿಂಡಿಯ</strong> (nāḷege tiṇḍiya) – tomorrow’s food</li>
<li><strong>ಈಗಲೆ ಹುಡುಕುವ</strong> (īgale huḍukuva) – to search right now / immediately</li>
<li><strong>ಆಸೆಯು ಹೆಚ್ಚಿತು</strong> (āseyu heccitu) – desire increased</li>
<li><strong>ನೀರೂರಿ</strong> (nīrūri) – mouth-watering / salivating</li>
<li><strong>ಹೌದೌದೆನ್ನುತ</strong> (haudau d-ennuta) – saying “yes, yes” (agreeing repeatedly)</li>
<li><strong>ಹಣ್ಣನು ಸುಲಿದವು</strong> (haṇṇanu sulidavu) – peeled the fruit</li>
</ul>
</aside></script></section></section><section ><section data-markdown><script type="text/template">
